<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#183d33" />
    <title>ServZest · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f4ee;color:#183d33;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,430px);padding:34px;border:1px solid #dedbd1;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(24,61,51,.12)}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:#183d33;color:#fff;font-size:28px;font-weight:900}h1{margin:25px 0 9px;font-family:Georgia,serif;font-size:34px;line-height:1}p{margin:0;color:#5d665f;line-height:1.6}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:14px;background:#183d33;color:#fff;font:700 15px system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">S</div>
      <h1>Connection paused.</h1>
      <p>ServZest needs internet for bookings, payments and live professional tracking. Reconnect, then try again.</p>
      <button type="button" onclick="if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))).then(() => location.href = '/'); } else { location.href = '/'; }">Try again</button>
    </main>
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
        }
      }
    </script>
  </body>
</html>
