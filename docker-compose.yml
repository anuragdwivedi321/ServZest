version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: servzest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servzest-local-only}
      POSTGRES_DB: servzest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servzest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
