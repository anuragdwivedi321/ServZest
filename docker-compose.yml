version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: quickkaam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quickkaam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickkaam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
